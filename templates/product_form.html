{% extends 'base.html' %}{% block content %}<div class="actions" style="justify-content:space-between;align-items:center"><div><h1>{{ title }}</h1><div class="muted">{{ subtitle }}</div></div><a href="{{ url_for('products_index') }}">Volver</a></div>{% if error %}<div class="card"><div class="mono">{{ error }}</div></div>{% endif %}<div class="card"><form method="post" class="stack"><label>Nombre<input name="ProductName" value="{{ form.ProductName or '' }}" required></label><label>Código<input name="ProductCode" value="{{ form.ProductCode or '' }}"></label><label>Precio retail<input name="PrRetailPrice" value="{{ form.PrRetailPrice or '' }}"></label><label>Precio costo<input name="PrCostPrice" value="{{ form.PrCostPrice or '' }}"></label><label>Tipo<select name="CiType"><option value="">—</option>{% for c in categories %}<option value="{{ c.CtID if c.CtID is defined else c['CtID'] }}" {% if (form.CiType or '')|string == (c.CtID if c.CtID is defined else c['CtID'])|string %}selected{% endif %}>{{ c.CtName if c.CtName is defined else c['CtName'] }}</option>{% endfor %}</select></label><label>Fabricante<select name="Manufacturers"><option value="">—</option>{% for m in manufacturers %}<option value="{{ m.MiID if m.MiID is defined else m['MiID'] }}" {% if (form.Manufacturers or '')|string == (m.MiID if m.MiID is defined else m['MiID'])|string %}selected{% endif %}>{{ m.MiName if m.MiName is defined else m['MiName'] }}</option>{% endfor %}</select></label><label>Especificación<input name="PrSpecification" value="{{ form.PrSpecification or '' }}"></label><label>Contenido<textarea name="PrContent" rows="4">{{ form.PrContent or '' }}</textarea></label><label>Adult limit<input name="PrAdultLimit" value="{{ form.PrAdultLimit or '0' }}"></label><label>Ali adult limit<input name="PrAliAdultLimit" value="{{ form.PrAliAdultLimit or '0' }}"></label><label>Promoción<input name="PrPromotionPrice" value="{{ form.PrPromotionPrice or '' }}"></label><label>Miembro<input name="PrMemberPrice" value="{{ form.PrMemberPrice or '' }}"></label><label>Descuento<input name="PrDiscount" value="{{ form.PrDiscount or '' }}"></label><label>Tax rate<input name="PrTaxRate" value="{{ form.PrTaxRate or '' }}"></label><label>Quality period<input name="QualityPeriod" value="{{ form.QualityPeriod or '' }}"></label><label>Img path<input name="ImgPath" value="{{ form.ImgPath or '' }}"></label><div class="actions"><button type="submit">Guardar</button><a href="{{ url_for('products_index') }}">Cancelar</a></div></form></div>{% endblock %}
