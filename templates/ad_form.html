{% extends 'base.html' %}{% block content %}<h1>{{ 'Editar' if ad else 'Nueva' }} ad</h1><form method="post" class="card"><div class="row"><div><label>Clave ad</label><input name="ad_key" value="{{ ad.ad_key if ad else '' }}" required></div><div><label>Título</label><input name="title" value="{{ ad.title if ad else '' }}" required></div></div><div class="row"><div><label>GoodsAdUrl</label><input name="goods_ad_url" value="{{ ad.goods_ad_url if ad else '' }}" required></div><div><label>ImageUrl</label><input name="image_url" value="{{ ad.image_url if ad else '' }}"></div></div><label><input type="checkbox" name="active" value="1" {% if not ad or ad.active %}checked{% endif %} style="width:auto"> activa</label><div style="margin-top:12px" class="actions"><button>Guardar</button><a href="{{ url_for('ads_index') }}">Cancelar</a></div></form>{% endblock %}
