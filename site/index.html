<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estado máquinas expendedoras</title>
  <style>
    * { box-sizing: border-box; }
    :root { --bg:#07111f; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.12); --text:#fff; --muted:rgba(255,255,255,.7); --link:#9dd7ff; }
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.6; background: var(--bg); color: var(--text); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 18px 14px 36px; }
    h1,h2,h3,p,ul { margin-top: 0; }
    .summary, .overview, .links { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:18px; }
    .card, .machine, .navcard { background: var(--panel); border:1px solid var(--line); border-radius: 14px; }
    .card, .machine { padding: 14px; }
    .navcard { padding: 16px; text-decoration: none; color: inherit; display:block; }
    .navcard strong { display:block; font-size: 20px; margin-bottom: 4px; color: var(--link); }
    .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .big { font-size: 28px; font-weight: 700; line-height: 1.15; }
    .machine { margin-bottom: 12px; }
    .row { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .pill { display:inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .online { background:#123b26; color:#7ee2a8; }
    .offline { background:#4a1f25; color:#ff9aa8; }
    .unknown { background:#3a3520; color:#ffe390; }
    dl { display:grid; grid-template-columns: 180px 1fr; gap: 8px 12px; margin: 14px 0 0; }
    dt { color: var(--muted); }
    dd { margin:0; }
    .muted { color: var(--muted); }
    .error { color: #ff9aa8; }
    a { color: var(--link); }
    @media (max-width: 640px) {
      body { font-size: 18px; }
      .wrap { padding: 14px 12px 28px; }
      .summary, .overview, .links { grid-template-columns: 1fr 1fr; gap:10px; }
      .card, .machine, .navcard { border-radius: 12px; }
      .card, .machine, .navcard { padding: 16px; }
      .big { font-size: 30px; }
      .navcard strong { font-size: 22px; }
      h1 { font-size: 34px; line-height: 1.1; }
      h2 { font-size: 26px; line-height: 1.15; }
      dl { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Estado actual de máquinas</h1>
    <p class="muted">GitHub Pages snapshot vivo. Refresco por GitHub Actions.</p>
    <div class="links">
      <a class="navcard" href="./ourvend/index.html"><strong>OurVend</strong><span class="muted">backend, control y superficies</span></a>
      <a class="navcard" href="./machine/index.html"><strong>Machine</strong><span class="muted">máquina, docs y fuentes</span></a>
    </div>
    <div class="summary" id="summary"></div>
    <div class="overview" id="overview"></div>
    <div id="machines"></div>
    <p class="muted">Repo: <a href="https://github.com/sebasfavaron/vending-status">sebasfavaron/vending-status</a></p>
  </div>
  <script>
    function statusClass(label) { if (label === 'online') return 'online'; if (label === 'offline') return 'offline'; return 'unknown'; }
    function pretty(label) { return ({ online: 'online', offline: 'offline' }[label]) || label || 'unknown'; }
    function renderSummary(data) {
      document.getElementById('summary').innerHTML = `
        <div class="card"><div class="label">Máquinas</div><div class="big">${data.machine_count ?? '—'}</div></div>
        <div class="card"><div class="label">Online</div><div class="big">${data.online_count ?? '—'}</div></div>
        <div class="card"><div class="label">Offline</div><div class="big">${data.offline_count ?? '—'}</div></div>
        <div class="card"><div class="label">Actualizado</div><div>${data.updated_at ? new Date(data.updated_at).toLocaleString() : '—'}</div></div>`;
      const o = data.overview || {};
      document.getElementById('overview').innerHTML = `
        <div class="card"><div class="label">Ventas hoy</div><div class="big">${o.sales_today_total ?? '0'}</div><div class="muted">cash ${o.sales_today_cash ?? '0'} · non-cash ${o.sales_today_non_cash ?? '0'}</div></div>
        <div class="card"><div class="label">Máquinas con faltantes</div><div class="big">${o.stockout_machine_count ?? '0'}</div><div class="muted">slots ${o.stockout_slot_count ?? '0'} · productos ${o.stockout_commodity_count ?? '0'}</div></div>
        <div class="card"><div class="label">Red anormal</div><div class="big">${o.abnormal_network_count ?? '0'}</div></div>
        <div class="card"><div class="label">Máquinas con falla</div><div class="big">${o.faulty_machine_count ?? '0'}</div></div>`;
    }
    function renderMachines(data) {
      const root = document.getElementById('machines');
      if (!Array.isArray(data.machines) || data.machines.length === 0) { root.innerHTML = '<div class="card error">Sin máquinas visibles.</div>'; return; }
      root.innerHTML = data.machines.map(m => `
        <section class="machine">
          <div class="row">
            <div><h2 style="margin:0 0 6px 0">${m.alias || m.machine_id}</h2><div class="muted">Grupo: ${m.group_name || '—'}</div></div>
            <div><span class="pill ${statusClass(m.network?.label)}">${pretty(m.network?.label)}</span></div>
          </div>
          <dl>
            <dt>ID máquina</dt><dd>${m.machine_id || '—'}</dd>
            <dt>Temperatura</dt><dd>${m.temperature_raw || '—'}</dd>
            <dt>Puerta</dt><dd>${m.door?.label || '—'}</dd>
            <dt>Sensor de caída</dt><dd>${m.drop_sensor?.label || '—'}</dd>
            <dt>Lector / pagos</dt><dd>${m.card_reader?.label || '—'}</dd>
            <dt>Estado slots</dt><dd>${m.slot_status || '—'}</dd>
            <dt>Ventas hoy</dt><dd>${m.sales_today?.amount || '0'} · ${m.sales_today?.quantity || '0'} ventas</dd>
            <dt>Faltantes</dt><dd>${m.stock?.out_of_stock ? 'sí' : 'no'}</dd>
            <dt>Última señal</dt><dd>${m.freshness?.last_upload_time || 'sin dato'}</dd>
            <dt>Versión</dt><dd>${m.version || '—'}</dd>
            <dt>Acciones visibles</dt><dd>${Array.isArray(m.visible_actions) ? m.visible_actions.join(' · ') : '—'}</dd>
          </dl>
        </section>`).join('');
    }
    async function refresh() {
      try {
        const res = await fetch('./status.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('status ' + res.status);
        const data = await res.json();
        renderSummary(data); renderMachines(data);
      } catch (err) {
        document.getElementById('summary').innerHTML = '<div class="card error">No pude cargar el estado.</div>';
        document.getElementById('overview').innerHTML = '';
        document.getElementById('machines').innerHTML = `<div class="card error">${String(err.message || err)}</div>`;
      }
    }
    refresh();
  </script>
</body>
</html>
