<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ballbox Status</title><link rel="stylesheet" href="/ballbox/assets/ballbox.css?v=20260620e"></head><body><script src="/ballbox/assets/ballbox.js?v=20260620e"></script><script>shell('Status');loadData('status').then(p=>{renderMeta(p);const d=p.data||{};const q=qs('q').toLowerCase();const client=qs('client');const rows=filterItems(d.machines||[],m=>(!q||JSON.stringify(m).toLowerCase().includes(q))&&(!client||m.client===client));document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="muted">Máquinas</div><div class="big">${d.machine_count||0}</div></div><div class="card"><div class="muted">Online</div><div class="big">${d.online_count||0}</div></div><div class="card"><div class="muted">Offline</div><div class="big">${d.offline_count||0}</div></div></div><div class="filters"><input id="q" placeholder="buscar" value="${esc(q)}"><select id="client"><option value="">todos los clientes</option><option value="adidas" ${client==='adidas'?'selected':''}>adidas</option></select></div><div class="card"><table><tr><th>Machine</th><th>Site</th><th>Network</th><th>Freshness</th><th>Stock</th><th>Sales today</th></tr>${rows.map(m=>`<tr><td><a href="/ballbox/machines/?machine_id=${m.machine_id}">${esc(m.label||m.alias||m.machine_id)}</a><div class="muted mono">${esc(m.machine_id)}</div></td><td>${esc(m.site||'—')}</td><td>${esc(m.network?.label||'unknown')}</td><td>${esc(m.freshness?.last_upload_time||'—')}</td><td>${m.stock?.out_of_stock?'out_of_stock':'ok'}</td><td>${esc(m.sales_today?.quantity||'0')} · ${money(m.sales_today?.amount||0)}</td></tr>`).join('')}</table></div>`;document.getElementById('q').onchange=()=>{const u=new URL(location);u.searchParams.set('q',document.getElementById('q').value);location=u};document.getElementById('client').onchange=()=>{const u=new URL(location);if(document.getElementById('client').value)u.searchParams.set('client',document.getElementById('client').value);else u.searchParams.delete('client');location=u}})</script></body></html>
