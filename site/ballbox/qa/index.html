<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ballbox QA</title><link rel="stylesheet" href="/ballbox/assets/ballbox.css?v=20260620e"></head><body><script src="/ballbox/assets/ballbox.js?v=20260620e"></script><script>shell('QA');document.getElementById('meta').innerHTML='<div class="banner muted">Canonical knowledge lives in ballbox-db. This page is the public Ballbox shell over that backend.</div>';const title=document.querySelector('main h1');if(title){title.outerHTML=`<div class="page-title-row"><h1>${title.textContent}</h1><button id="qa-reset-mobile" class="qa-reset-mobile">Nueva pregunta</button></div>`}document.getElementById('app').innerHTML=`<div id="qa-composer-top" class="card qa-composer"><div class="muted">Ask about company, strategy, ops, machine reality, open questions, or current portal JSON numbers.</div><div class="filters"><textarea id="q" style="width:100%;min-height:120px;background:#0b1220;border:1px solid #31425f;color:#fff;border-radius:12px;padding:12px" placeholder="Ej: cuánto es el monto total vendido hoy y qué fuente lo respalda?"></textarea></div><div class="row qa-actions"><div class="muted" id="qa-status">0/3 follow-ups used</div><div><button id="qa-reset">Nueva conversación</button> <button id="qa-ask">Preguntar</button></div></div></div><div id="qa-chat" class="list qa-chat" style="margin-top:14px"></div><div id="qa-composer-bottom"></div>`;const STORAGE_KEY='ballbox-qa-chat-v1';const MAX_FOLLOWUPS=3;let state=loadState();let loading=false;function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);const parsed=raw?JSON.parse(raw):{};return {messages:Array.isArray(parsed.messages)?parsed.messages:[]}}catch{return {messages:[]}}}function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}function followupsUsed(){return Math.max(0,state.messages.filter(m=>m.role==='user').length-1)}function atLimit(){return followupsUsed()>=MAX_FOLLOWUPS&&state.messages.some(m=>m.role==='assistant'&&m.kind!=='error')}function placeComposer(){const top=document.getElementById('qa-composer-top');const bottom=document.getElementById('qa-composer-bottom');if(!top||!bottom)return;if(state.messages.some(m=>m.role==='user'))bottom.appendChild(top);else document.getElementById('app').insertBefore(top,document.getElementById('qa-chat'))}function resetQA(){state={messages:[]};saveState();renderChat();document.getElementById('q').value=''}function renderChat(){placeComposer();const chat=document.getElementById('qa-chat');const status=document.getElementById('qa-status');const ask=document.getElementById('qa-ask');const q=document.getElementById('q');chat.innerHTML=state.messages.map(m=>`<div class="card"><div class="muted">${m.role==='user'?'You':(m.kind==='error'?'Error':'Ballbox')}</div><div>${m.role==='assistant'&&m.html?m.html:'<pre style="white-space:pre-wrap;margin:0">'+esc(m.text||'')+'</pre>'}</div></div>`).join('');status.textContent=loading?'consultando...':`${followupsUsed()}/3 follow-ups used`;ask.disabled=loading||atLimit();q.disabled=loading||atLimit();q.placeholder=atLimit()?'Follow-up limit reached. Start a new conversation.':'Ej: cuánto es el monto total vendido hoy y qué fuente lo respalda?'}async function askQA(){const q=document.getElementById('q');const question=q.value.trim();if(!question||loading||atLimit())return;const history=state.messages.filter(m=>m.role==='user'||(m.role==='assistant'&&m.kind!=='error')).map(m=>({role:m.role,text:m.text||''}));state.messages.push({role:'user',text:question});q.value='';loading=true;renderChat();saveState();try{const res=await fetch('/ballbox/qa/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,history})});const data=await res.json();if(!res.ok||data.error){state.messages.push({role:'assistant',kind:'error',text:data.error||('request failed '+res.status)})}else{state.messages.push({role:'assistant',text:data.answer||'',html:data.answer_html||('<pre style="white-space:pre-wrap;margin:0">'+esc(data.answer||'')+'</pre>')})}}catch(e){state.messages.push({role:'assistant',kind:'error',text:String(e)})}finally{loading=false;saveState();renderChat()}}document.getElementById('qa-ask').onclick=askQA;document.getElementById('qa-reset').onclick=resetQA;document.getElementById('qa-reset-mobile').onclick=resetQA;document.getElementById('q').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')askQA()});renderChat();</script></body></html>
