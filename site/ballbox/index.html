<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ballbox</title><link rel="stylesheet" href="/ballbox/assets/ballbox.css?v=20260620e"></head><body><script src="/ballbox/assets/ballbox.js?v=20260620e"></script><script>shell('Ballbox todo-en-uno');loadData('home').then(p=>{renderMeta(p);const d=p.data||{};const s=d.summary||{};const spotlight=d.spotlight;document.getElementById('app').innerHTML=`<div class="grid"><a class="card" href="/ballbox/machines/"><div class="muted">Máquinas en directorio</div><div class="big">${s.machines||0}</div><div class="muted">con status live: ${s.machines_with_live_status||0}</div></a><a class="card" href="/ballbox/status/"><div class="muted">Online</div><div class="big">${s.online||0}</div></a><a class="card" href="/ballbox/status/"><div class="muted">Offline</div><div class="big">${s.offline||0}</div></a><a class="card" href="/ballbox/inventory/?client=adidas"><div class="muted">Productos inventario</div><div class="big">${s.inventory_slots||0}</div><div class="muted">ir al detalle normalizado</div></a><a class="card" href="/ballbox/sales/?client=adidas"><div class="muted">Ventas</div><div class="big">${s.sales_ventas||0}</div><div class="muted">${money(s.sales_monto_total||0)}</div></a><a class="card" href="/ballbox/products/"><div class="muted">Productos</div><div class="big">${s.products||0}</div></a></div><div class="links" style="margin-top:14px">${(d.links||[]).map(x=>`<a class="navcard" href="${x.url}"><strong>${x.label}</strong><span class="muted">abrir sección</span></a>`).join('')}<a class="navcard" href="/ballbox/inventory/?client=adidas"><strong>Adidas inventory</strong><span class="muted">filtro por cliente + slots merged normalizados</span></a><a class="navcard" href="/ballbox/sales/?client=adidas"><strong>Adidas sales</strong><span class="muted">filtro por cliente + breakdowns</span></a></div>${spotlight?`<div class="card" style="margin-top:14px"><h2>Spotlight</h2><div><strong>${esc(spotlight.label)}</strong></div><div class="muted">${esc(spotlight.site||'—')} · ${esc(spotlight.machine_id)}</div><div class="row" style="margin-top:10px"><a href="${spotlight.actions.inventory}">Inventory detail</a><a href="${spotlight.actions.sales}">Sales detail</a></div></div>`:''}`}).catch(err=>{shell('Ballbox todo-en-uno');document.getElementById('app').innerHTML=`<div class="banner bad">${esc(String(err))}</div>`})</script></body></html>
