<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ballbox Products</title><link rel="stylesheet" href="/ballbox/assets/ballbox.css?v=20260620e"></head><body><script src="/ballbox/assets/ballbox.js?v=20260620e"></script><script>shell('Products');loadData('products').then(p=>{renderMeta(p);const d=p.data||{};const q=qs('q').toLowerCase();const rows=filterItems(d.products||[],r=>!q||JSON.stringify(r).toLowerCase().includes(q));const configured=d.configured_price_points||[];document.getElementById('app').innerHTML=`<div class="banner warn">${esc(d.truth_note||'')}</div><div class="grid"><div class="card"><div class="muted">Vendor catalog rows</div><div class="big">${d.count||0}</div></div><a class="card" href="/ballbox/inventory/?client=adidas"><div class="muted">Machine-configured price points</div><div class="big">${configured.length}</div><div class="muted">open inventory for real slot detail</div></a><div class="card"><div class="muted">Categorías</div><div class="big">${(d.categories||[]).length}</div></div></div><div class="filters"><input id="q" placeholder="buscar" value="${esc(q)}"></div><div class="card"><h2>Machine-configured catalog snapshot</h2><table><tr><th>Machine</th><th>Price</th><th>Name</th><th>Product ID</th></tr>${configured.map(r=>`<tr><td><a href="/ballbox/inventory/?machine_id=${esc(r.machine_id)}">${esc(r.label||r.machine_id)}</a></td><td>${esc(r.price||'—')}</td><td>${esc(r.name||'—')}</td><td>${esc(r.product_id||'—')}</td></tr>`).join('')}</table></div><div class="card"><h2>Vendor product catalog</h2><table><tr><th>Product ID</th><th>Name</th><th>Price</th><th>Type</th><th>Status</th></tr>${rows.map(r=>`<tr><td><div>${esc(r.product_id||'—')}</div><div class="mono muted">${esc(r.vendor_product_id||'—')}</div></td><td>${esc(r.name||'—')}</td><td>${money(r.price||0)}</td><td>${esc(r.type||'—')}</td><td>${esc(r.status_label||'—')}</td></tr>`).join('')}</table></div>`;document.getElementById('q').onchange=()=>{const u=new URL(location);if(document.getElementById('q').value)u.searchParams.set('q',document.getElementById('q').value);else u.searchParams.delete('q');location=u}})</script></body></html>
