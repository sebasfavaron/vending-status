<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ballbox Cloud</title><link rel="stylesheet" href="/ballbox/assets/ballbox.css?v=20260620e"></head><body><script src="/ballbox/assets/ballbox.js?v=20260620e"></script><script>shell('Cloud');loadData('cloud').then(p=>{renderMeta(p);const d=p.data||{};const sources=`<div class="list">${(d.sources||[]).map(s=>`<section class="card"><strong>${esc(s.name)}</strong><div class="muted">${esc(s.notes||'')}</div><div class="mono">${esc(s.path||'')}</div><div>ok: ${String(!!s.ok)} · generated_at: ${esc(s.generated_at||'—')}</div>${s.public_url?`<div style="margin-top:10px"><a href="${s.public_url}">Open full JSON</a></div>`:''}</section>`).join('')}</div>`;const knowledge=`<div class="card" style="margin-top:14px"><h2>Knowledge</h2><div class="list">${(d.knowledge||[]).map(x=>`<section><strong>${esc(x.name)}</strong><div class="muted">${esc(x.notes||'')}</div>${x.url?`<div style="margin-top:8px"><a href="${x.url}">Open</a></div>`:''}${x.repo_path?`<div class="mono" style="margin-top:8px">${esc(x.repo_path)}</div>`:''}</section>`).join('')}</div></div>`;const system=`<div class="card" style="margin-top:14px"><h2>System map</h2><div class="row"><div><strong>Public surface</strong><ul>${((d.system_map||{}).public_surface||[]).map(x=>`<li class="mono">${esc(x)}</li>`).join('')}</ul></div><div><strong>Runtime</strong><ul>${((d.system_map||{}).runtime||[]).map(x=>`<li><span class="mono">${esc(x.path||'')}</span><div class="muted">${esc(x.name||'')}</div></li>`).join('')}</ul></div></div><div style="margin-top:10px"><strong>Repos</strong><ul>${((d.system_map||{}).repos||[]).map(x=>`<li><strong>${esc(x.name||'')}</strong> · ${esc(x.role||'')}</li>`).join('')}</ul></div></div>`;const legacy=`<div class="card" style="margin-top:14px"><h2>Legacy docs</h2><ul>${(d.legacy_docs||[]).map(x=>`<li><a href="${x.url}">${esc(x.label)}</a></li>`).join('')}</ul></div>`;document.getElementById('app').innerHTML=sources+knowledge+system+legacy})</script></body></html>
